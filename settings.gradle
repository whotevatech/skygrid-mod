pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { name = 'Fabric';    url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
    }
}

// The foojay toolchain resolver was removed here: its 0.8.0 release is Gradle 8-era
// and it is only needed to auto-DOWNLOAD a missing JDK. JDK 21 is already installed
// locally, so Gradle's own toolchain auto-detection is enough.
//
// If Gradle ever reports "No matching toolchains found for Java 21", re-add it with a
// Gradle 9-compatible version:
//     plugins { id 'org.gradle.toolchains.foojay-resolver-convention' version '<ver>' }

rootProject.name = 'skygrid'

include 'common'
include 'fabric'
include 'neoforge'
