// ---------------------------------------------------------------------------
//  fabric — thin loader wrapper around :common
//
//  Uses OFFICIAL MOJANG MAPPINGS (not Yarn) so the source is identical to the
//  common module and the neoforge module. This is the single biggest change
//  from the old Fabric-only project, which was Yarn-mapped.
//
//  Loom version verified against upstream maven — see gradle.properties.
// ---------------------------------------------------------------------------
plugins {
    id 'fabric-loom' version "${loom_version}"
}

repositories {
    maven {
        name = 'Terraformers'   // ModMenu
        url = 'https://maven.terraformersmc.com/releases'
    }
}

// No loom { } block needed:
//   - the mixin AP is off by default in Loom 1.17 and this mod has no mixins
//   - loom.mods { sourceSet project(':common') ... } would require the
//     'net.fabricmc.fabric-loom-companion' plugin applied to :common. That works,
//     but merging common's resources below achieves the same thing with no extra
//     plugin to resolve and version.

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    // Full Fabric API.
    //
    // This was briefly narrowed to individual modules to dodge a Loom bug
    // ("Javadoc provided by mod (fabric-content-registries-v0) must be have an
    // intermediary source namespace") seen on Loom 1.11-SNAPSHOT. That bug does
    // not occur on Loom 1.17.13.
    //
    // Narrowing turned out to be a false economy: it silently dropped
    // fabric-resource-loader-v1 (so the bundled world preset never loaded) and
    // fabric-registry-sync-v0 (so registering the chunk generator crashed with
    // "Registry is already frozen"). Both failures appeared far from the cause.
    // Depend on the bundle unless there is a concrete reason not to.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // ModMenu — Fabric has no built-in mods screen, so this is what provides the
    // config button. compileOnly: it is NOT required at runtime. If absent, the
    // SkyGridModMenu class is simply never loaded and /skygridgui still works.
    // localRuntime puts it in the dev client so the button can actually be tested.
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${modmenu_version}"

    implementation project(':common')
}

// Bundle the common CLASSES into the fabric jar.
//
// classesDirs only — NOT the full sourceSets.main.output. processResources below
// already merges common's resources into this module's resource output, so taking
// the whole output here would add pack.mcmeta, the world preset and the lang file
// a second time, and Gradle fails the build on duplicate entries.
tasks.named('jar') {
    from project(':common').sourceSets.main.output.classesDirs
}

// Merge :common's resources into this module's own resource output.
//
// This is what makes the bundled world preset, its tag, pack.mcmeta and the lang
// file visible to Fabric AT DEV RUNTIME. Without it, :common is only a classpath
// library — its classes load, but Fabric never scans its data/ as mod resources,
// so "Sky Grid" never appears in the World Type selector. The built jar was always
// correct; this only fixes runClient.
//
// NeoForge does not need this: its neoForge.mods { } block already declares
// :common's source set as part of the mod.
processResources {
    from project(':common').sourceSets.main.resources
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// ---------------------------------------------------------------------------
//  FALLBACKS if "must be have an intermediary source namespace" comes back
//  from a different Fabric API module:
//
//  1. Layer the mappings so intermediary is present alongside Mojang names:
//         mappings loom.layered { officialMojangMappings() }
//
//  2. Strip javadoc from the offending dependency:
//         modImplementation(fabricApi.module("...", fabric_api_version)) {
//             transitive = false
//         }
//
//  3. Try a different Loom build. 1.11-SNAPSHOT is a moving target; a tagged
//     release may not carry the bug.
//
//  Root cause is Loom trying to remap javadoc that Fabric API ships in the
//  intermediary namespace while this project uses Mojang names. Option 1 is
//  the most likely proper fix if narrowing the dependencies is not enough.
// ---------------------------------------------------------------------------
