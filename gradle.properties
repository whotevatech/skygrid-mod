org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false

# ============================================================================
#  1.21.1 BRANCH
#
#  This branch targets Minecraft 1.21.1, where the large tech mods still live
#  (Create, Mekanism, AE2, Thermal). Create skipped 1.21.8 and 1.21.11 entirely
#  and is still shipping releases on 1.21.1, so a tech-oriented pack has to be
#  built here. The 1.21.11 line lives on branch multiloader-1.21.11.
# ============================================================================

# ---- Minecraft ----
minecraft_version=1.21.1
# Upper bound matters: without it the mod claims compatibility with every future
# MC release and NeoForge will load it on versions it cannot possibly work on.
minecraft_version_range=[1.21.1,1.22)

# ---- Build tooling (verified against upstream maven on 2026-07-30) ----
# https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/
loom_version=1.17.13
# https://maven.neoforged.net/releases/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/
moddev_version=2.0.141
# https://maven.neoforged.net/releases/net/neoforged/neoform/  — the 1.21.1 release build
neoform_version=1.21.1-20240808.144430

# ---- Loaders (verified against upstream maven/meta on 2026-07-30) ----
# NeoForge latest for 1.21.1: https://maven.neoforged.net/releases/net/neoforged/neoforge/
neoforge_version=21.1.244
neoforge_version_range=[21.1,)
# 1.21.1 NeoForge uses loader version range [4,) as well, but older packs often
# see [1,); [4,) matches what 21.1.x ships with.
loader_version_range=[4,)

# Fabric Loader latest: https://meta.fabricmc.net/v2/versions/loader
fabric_loader_version=0.19.3
# Fabric API latest for 1.21.1
fabric_api_version=0.116.12+1.21.1
# ModMenu — optional at runtime, provides the Mods screen Fabric lacks.
# https://modrinth.com/mod/modmenu  (11.0.4 is the 1.21.1 release)
modmenu_version=11.0.4

# ---- Mod metadata ----
mod_id=skygrid
mod_name=WT Sky Grid
mod_version=2.0.0
mod_group_id=com.skygrid
mod_authors=Whoteva
mod_license=MIT
mod_description=A modern Sky Grid world generation mod. Blocks placed in a 3D grid floating in the void, with per-dimension pools, weights and full mod-block support.
