org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false

# ---- Minecraft ----
minecraft_version=1.21.11

# ---- Build tooling (verified against upstream maven on 2026-07-29) ----
# https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/
# Must be >= the Loom that Fabric API itself was built with (currently 1.13.3),
# or Loom refuses the dependency. Pinned rather than -SNAPSHOT for reproducibility.
loom_version=1.17.13
# https://maven.neoforged.net/releases/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/
moddev_version=2.0.141
# https://maven.neoforged.net/releases/net/neoforged/neoform/  — the 1.21.11 release build
neoform_version=1.21.11-20251209.172050

# ---- Loaders (verified against upstream maven/meta on 2026-07-29) ----
# NeoForge latest for 1.21.11: https://maven.neoforged.net/releases/net/neoforged/neoforge/
neoforge_version=21.11.44
neoforge_version_range=[21.11,)
loader_version_range=[4,)

# Fabric Loader latest: https://meta.fabricmc.net/v2/versions/loader
fabric_loader_version=0.19.3
# Fabric API latest for 1.21.11
fabric_api_version=0.141.4+1.21.11
# ModMenu — optional at runtime, provides the Mods screen Fabric lacks.
# https://modrinth.com/mod/modmenu  (17.0.0 is the 1.21.11 release)
modmenu_version=17.0.0

# ---- Mod metadata ----
mod_id=skygrid
mod_name=WT Sky Grid
mod_version=2.0.0
mod_group_id=com.skygrid
mod_authors=Whoteva
mod_license=MIT
mod_description=A modern Sky Grid world generation mod. Blocks placed in a 3D grid floating in the void, with per-dimension pools, weights and full mod-block support.
